<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أرشيف التقارير والصور المحفوظة - وحدة أعمال الباحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --alamr-deep: #0f3d24;
    --alamr-primary: #1a633b;
    --alamr-accent: #278551;
    --alamr-gold: #b68d40;
    --bg: #f6f8f7;
    --card: #ffffff;
    --text: #111827;
    --muted: #4b5563;
    --border: #dce5df;
  }
  * { box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif; }
  body { margin: 0; padding: 14px; background: var(--bg); color: var(--text); padding-bottom: 50px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .btn-nav { background: var(--alamr-deep); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 700; border: none; cursor: pointer; }
  .hero { background: linear-gradient(135deg, var(--alamr-deep), var(--alamr-primary)); color: #fff; padding: 20px; border-radius: 14px; margin-bottom: 14px; text-align: center; }
  .hero h1 { margin: 0 0 6px; font-size: 21px; font-family: 'Cairo', sans-serif; font-weight: 800; }
  .hero p { margin: 0; font-size: 13.5px; opacity: 0.92; }
  .card { background: var(--card); border-radius: 14px; padding: 15px; margin-bottom: 14px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  select, input[type="text"] { width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14.5px; background: #fff; color: var(--text); }
  .record-card { background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 12px; border-right: 5px solid var(--alamr-primary); }
  .record-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .badge-type { background: #eef7f2; color: var(--alamr-deep); padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; }
  .record-meta { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 10px; }
  .record-summary { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; line-height: 1.6; margin-bottom: 10px; }
  .photo-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .photo-link-btn { display: inline-flex; align-items: center; gap: 6px; background: #1a633b; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700; }
  .empty-state { text-align: center; padding: 30px 15px; color: var(--muted); font-size: 14.5px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="btn-nav">← العودة للبوابة الرئيسية</a>
  <button type="button" class="btn-nav" onclick="loadRecords()" style="background:#278551;">🔄 تحديث السجل من السحابة</button>
</div>

<div class="hero">
  <h1>أرشيف التقارير والصور المحفوظة</h1>
  <p>استعراض التقارير السابقة والصور المرفقة حسب العضو ونوع التقرير والمشروع</p>
</div>

<div class="card">
  <div class="filters-grid">
    <div>
      <label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;">تصفية حسب العضو:</label>
      <select id="filterInspector" onchange="renderFiltered()">
        <option value="all">-- جميع أعضاء الفريق --</option>
        <option value="م. سعيد جماح">م. سعيد جماح (رئيس قسم السلامة)</option>
        <option value="م. عثمان عبدالمنعم">م. عثمان عبدالمنعم</option>
        <option value="م. سراقة بانقا">م. سراقة بانقا</option>
        <option value="محمد حامد">محمد حامد</option>
        <option value="فارس الزهراني">فارس الزهراني</option>
        <option value="محجوب محمد">محجوب محمد</option>
        <option value="سعد الزهراني">سعد الزهراني</option>
        <option value="عبدالعزيز الزهراني">عبدالعزيز الزهراني</option>
        <option value="عباس مصطفى">عباس مصطفى</option>
        <option value="عبدالله شكاك">عبدالله شكاك</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;">نوع التقرير:</label>
      <select id="filterType" onchange="renderFiltered()">
        <option value="all">-- جميع النماذج --</option>
        <option value="VisitReports">تقرير زيارة ميدانية</option>
        <option value="Observations">سجل ملاحظات السلامة</option>
        <option value="StopWorkOrders">أمر إيقاف عمل</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;">بحث بالمشروع أو المقاول:</label>
      <input type="text" id="filterSearch" placeholder="اكتب اسم المقاول أو رقم العقد..." oninput="renderFiltered()">
    </div>
  </div>
</div>

<div id="recordsList">
  <div class="empty-state">جاري تحميل التقارير المحفوظة من السحابة...</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjjXUcuOl3vjFlHkYCNWNivMwleGF0zXVz4tznVDMU1Vlv5AcBVnRSoDl0C--tRRXh/exec";
  let allRecords = [];

  const typeLabels = {
    VisitReports: "تقرير زيارة ميدانية",
    Observations: "سجل ملاحظات السلامة",
    StopWorkOrders: "أمر إيقاف عمل"
  };

  function cleanVal(v) {
    const s = String(v || "").trim();
    return (s === "-" || s === "—") ? "" : s;
  }

  function isMeaningfulRecord(r) {
    const insp = cleanVal(r.inspector);
    const proj = cleanVal(r.project);
    const cont = cleanVal(r.contractor);
    const sum = cleanVal(r.summary);
    const hasPhotos = Array.isArray(r.photos) && r.photos.length > 0;
    return Boolean(insp || proj || cont || sum || hasPhotos);
  }

  async function loadRecords() {
    const box = document.getElementById("recordsList");
    box.innerHTML = '<div class="empty-state">جاري جلب السجلات والصور...</div>';
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "تعذر جلب البيانات");
      allRecords = (data.records || []).filter(isMeaningfulRecord);
      applyLoggedInUserFilter();
      renderFiltered();
    } catch (err) {
      box.innerHTML = `<div class="empty-state">تعذر الاتصال بالسحابة حالياً: ${err.message}</div>`;
    }
  }

  function applyLoggedInUserFilter() {
    try {
      const user = JSON.parse(localStorage.getItem("hse_current_user") || "null");
      if (user && user.name) {
        const sel = document.getElementById("filterInspector");
        if (user.role === "head" || user.role === "engineer") {
          sel.value = "all";
        } else {
          for (let i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === user.name) {
              sel.selectedIndex = i;
              break;
            }
          }
        }
      }
    } catch (e) {}
  }

  function renderFiltered() {
    const insp = document.getElementById("filterInspector").value;
    const type = document.getElementById("filterType").value;
    const q = document.getElementById("filterSearch").value.trim().toLowerCase();
    const box = document.getElementById("recordsList");

    const list = allRecords.filter(r => {
      const rInsp = cleanVal(r.inspector);
      const rProj = cleanVal(r.project);
      const rCont = cleanVal(r.contractor);
      const rLoc = cleanVal(r.location);
      const rSum = cleanVal(r.summary);
      const mInsp = (insp === "all" || rInsp === insp);
      const mType = (type === "all" || r.reportType === type);
      const hay = `${rProj} ${rCont} ${rLoc} ${rSum} ${rInsp}`.toLowerCase();
      const mQ = (!q || hay.includes(q));
      return mInsp && mType && mQ;
    });

    if (list.length === 0) {
      box.innerHTML = '<div class="empty-state">لا توجد تقارير محفوظة حالياً؛ سيبدأ الأرشيف بالظهور تلقائياً عند حفظ أول تقرير من النماذج.</div>';
      return;
    }

    box.innerHTML = list.map(r => {
      const rInsp = cleanVal(r.inspector) || "غير محدد";
      const rProj = cleanVal(r.project) || "غير محدد";
      const rCont = cleanVal(r.contractor) || "غير محدد";
      const rLoc = cleanVal(r.location) || "غير محدد";
      const rDate = cleanVal(r.visitDate);
      const rSum = cleanVal(r.summary) || "بدون ملخص";
      const photos = (r.photos || []).map(p => cleanVal(p)).filter(Boolean);

      const photosHtml = photos.map((url, i) =>
        `<a href="${url}" target="_blank" rel="noopener" class="photo-link-btn">🖼️ عرض الصورة (${i + 1}) ↗</a>`
      ).join("");

      return `
        <div class="record-card">
          <div class="record-top">
            <span class="badge-type">${typeLabels[r.reportType] || r.reportType}</span>
            <strong style="font-size:13.5px;color:#0f3d24;">👤 ${rInsp}${rDate ? ` | 📅 ${rDate}` : ""}</strong>
          </div>
          <div class="record-meta">
            <strong>المقاول:</strong> ${rCont}<br>
            <strong>المشروع:</strong> ${rProj}<br>
            <strong>الموقع:</strong> ${rLoc}
          </div>
          <div class="record-summary">${rSum}</div>
          ${photosHtml ? `<div class="photo-links">${photosHtml}</div>` : `<div style="font-size:12px;color:#64748b;">لا توجد صور مرفقة في هذا التقرير</div>`}
        </div>
      `;
    }).join("");
  }

  loadRecords();
</script>
</body>
</html>
